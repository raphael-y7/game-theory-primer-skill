schema_version: 1
bundle_id: bundle.gibbons-game-theory
book:
  title: 博弈论基础（A Primer in Game Theory）
  author: "[美]罗伯特·吉本斯（Robert Gibbons）著，高峰译、魏玉根校"
  source_pack: EPUB（中国社会科学出版社1999年3月第1版，当代经济学教科书译丛）
  baseline_tag: v1.0.0
entry:
  name: game-theory-primer-skill
  description: "吉本斯《博弈论基础》单一入口：按信息（完全/不完全）×时序（静态/动态）判定博弈类型，匹配四个逐级强化的均衡概念（纳什均衡/子博弈精炼/贝叶斯纳什/精炼贝叶斯），并对长期关系可持续性、信号可信性、承诺可信度、激励结构等市场博弈问题给出可执行求解程序；蒸馏倾向=辅助股票投资分析。"
  core_principles:
    - 先判博弈类型（信息×时序两问）再选均衡概念，判错象限全套结论失效
    - 均衡是互相最优反应的稳定点，是条件性剧本而非点预测；多重均衡时用再精炼收敛
    - 动态博弈中只有可信的威胁与承诺起作用（子博弈精炼剔除不可置信行为）
    - 长期关系中合作能否自我维持由贴现因子门槛决定（触发战略条件）
    - 信号的可信性来自不同类型模仿成本的差异（单交叉），分离必扭曲
    - 限完全/不完全信息静态与动态博弈的教科书模型框架，收益函数须可写出
  out_of_scope:
    - 行为博弈与实验经济学偏离（1992年成书未覆盖）
    - 需要真实收益函数数据而只有定性描述的场景（建模前先问，不代拟收益）
    - 均衡之外的动态调整过程（学习/演化/高频微观结构）
  stop_conditions:
    - 收益函数或类型分布无法合理给出且用户拒绝假设时，停止并说明缺失
    - 判定出博弈类型后若用户场景与全部四类都不匹配，停止并声明本入口不适用
    - 多重均衡经再精炼仍无法收敛时，输出条件性剧本清单而非强行点预测
router_entry:
  name: game-theory-primer-skill-router
  description: "吉本斯《博弈论基础》来源路由入口：按任务（建模/求解/动态可信性/重复博弈/不完全信息/信号/声誉/激励/机制设计）把请求路由到19张能力卡；也承担查术语（GLOSSARY 42词条）与定位原书章节（合并转写稿）。"
promotion_budget: 8
