  - capability_id: cap.gibbons-game-theory.mixed-strategy-reinterp
    revision: 1
    status: active
    slug: mixed-strategy-reinterp
    title: 混合战略的正确解读：对手的不确定性与净化
    importance: medium
    importance_rationale: task-08解读卡——防止把均衡随机化误读为可预测；对市场对手行为解读（跟风盘/主力、竞拍）是高频误用点，但无独立计算负载故medium
    one_liner: 混合战略纳什均衡的正确含义是"我对你行动的不确定性"而非对手掷骰子——豪尔绍尼净化将其正式化为对私人信息的不确定性，均衡概率由对手收益决定且随机化不可预测。
    intents: [解读对手无规律行为是噪音还是均衡性质, 从混合均衡概率反推对手收益/信息结构, 校准己方策略消除可被利用的规律]
    keywords: [混合战略, 不确定性, 净化, 豪尔绍尼, 无差异, 不可预测, mixed strategy, purification, Harsanyi, unpredictable]
    also_read: [cap.gibbons-game-theory.nash-equilibrium-solver, cap.gibbons-game-theory.bayesian-nash-solver]
    card: cards/mixed-strategy-reinterp.md
    source_evidence:
