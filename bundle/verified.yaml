        version_id: epub-cass-1999
        location: 1.3.A；3.2.A净化
    frontmatter:
      description: "解读混合战略均衡含义：混合战略=对手对你行动的不确定性（1.3.A），正式化为豪尔绍尼净化（3.2.A，性别战x→0收敛2/3）。Trigger：中\"随机化/不可预测/反常行为\"，英\"mixed strategy/purification/unpredictable\"。预测含义：均衡中随机化不可被利用、概率由对手收益结构决定。边界：混合≠掷骰子、检验须在混合层执行、净化依赖线性收益、未纳入行为偏离。"
      tags: [game-theory, mixed-strategy, harsanyi-purification, task-08]
