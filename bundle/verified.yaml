    status: active
    slug: game-type-classifier
    title: 博弈类型判定与均衡概念选择
    importance: critical
    importance_rationale: task-01前置判定（覆盖审计13/13任务的入口）；DIGEST主流程第一环；19卡中12张以其结论为前置输入
    one_liner: 用"收益是否共同知识×行动有无先后且可观察"两问定位2×2象限，为四类博弈配对四个逐级强化的均衡概念（NE/SPNE/BNE/PBE），强概念在简单博弈中退化为弱概念。
    intents: [判定互动场景的博弈类型, 选择匹配的均衡概念, 校验分析所用均衡概念与场景是否错配]
    keywords: [博弈类型, 均衡概念选择, 纳什均衡, 子博弈精炼, 贝叶斯纳什均衡, 精炼贝叶斯均衡, game type, equilibrium concept, incomplete information]
